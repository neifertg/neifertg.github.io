<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/jpeg" href="{{ '/assets/profile.jpg' | relative_url }}">
{% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="#featured-work">Work</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#background-resume">Résumé</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main-content">
    {{ content }}
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var links = Array.prototype.slice.call(document.querySelectorAll('.site-nav a[href^="#"]'));
      var byId = {};
      var sections = [];
      links.forEach(function (a) {
        var id = a.getAttribute('href').slice(1);
        byId[id] = a;
        var el = document.getElementById(id);
        if (el) sections.push(el);
      });
      if ('IntersectionObserver' in window && sections.length) {
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              links.forEach(function (a) { a.classList.remove('active'); a.removeAttribute('aria-current'); });
              var link = byId[entry.target.id];
              if (link) { link.classList.add('active'); link.setAttribute('aria-current', 'true'); }
            }
          });
        }, { rootMargin: '-40% 0px -50% 0px', threshold: 0 });
        sections.forEach(function (s) { observer.observe(s); });
      }
    });
  </script>
</body>
</html>
